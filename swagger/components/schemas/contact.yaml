type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
properties:
  _id:
    description: 'Contact ID'
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: 'Contact name'
    type: string
    example: 'John'
  phoneNumber:
    description: 'Phone number'
    type: string
    example: '067221761985'
  email:
    description: 'Contact email'
    type: string
    example: 'example@gmail.com'
  isFavourite:
    description: 'Whether a contact has been added to favorites'
    type: boolean
    example: true
  contactType:
    description: 'Contact type'
    type: string
    enum: ['work', 'home', 'personal']
  userId:
    description: 'Contact user ID'
    type: string
    example: 65e4decdd285a30065c54ad9
  photo:
    description: 'Contact photo URL'
    type: string
    example: https://res.cloudinary.com/daireod39/image/upload/image.png
